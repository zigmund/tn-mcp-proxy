<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790">
<title>tn-mcp-proxy flow</title>
<desc>Keys go from your browser to the proxy only; the AI client holds a sealed token; the proxy unseals it on each call and sends X-TN-* headers to the Tradernet MCP.</desc>

