# tn-mcp-proxy example configuration.

# Address the HTTP server binds to (nginx terminates TLS in front of it).
listen: 127.0.0.1:8787

# Public base URL as seen by claude.ai or ChatGPT. Absolute https origin, no
# path/query/fragment. http is accepted only for loopback hosts (localhost,
# 127.0.0.0/8, ::1) unless allow_insecure_http is set. The same rule applies to
# oauth.allowed_redirect_uris and upstreams[].url.
public_url: https://mcp.example.com

# Accept plain http for non-loopback hosts in the URLs above. Default false;
# enabling it logs a startup warning. Only for trusted networks.
# allow_insecure_http: false

log:
  level: info    # debug|info|warn|error (debug enables access log)
  format: json   # json|text

secrets:
  # Token encryption keys live in a file with one base64 (standard) key of
  # exactly 32 random bytes per line; '#' comments and blank lines are ignored.
  # Generate a key with: openssl rand -base64 32
  # The first key encrypts; the rest only decrypt (key rotation).
  # Known-weak keys (the old published example key, all-zero, repeated-byte or
  # incrementing patterns) are rejected at startup.
  # This path is where the bundled systemd unit (LoadCredential=keys:...)
  # exposes the file; adjust it for other setups. A relative path is resolved
  # against this config file's directory.
  token_keys_file: /run/credentials/tn-mcp-proxy.service/keys
  # Alternative (set exactly one of token_keys / token_keys_file): inline keys.
  # token_keys:
  #   - "<output of: openssl rand -base64 32>"

# Durations: 0 or unset means the default; negative values are rejected.
oauth:
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  # Absolute lifetime of a login from the code exchange; refreshing never extends it.
  # max_session_ttl: 2160h
  code_ttl: 5m  # at most 10m; access_token_ttl at most 24h
  allowed_redirect_uris:
    - https://claude.ai/api/mcp/auth_callback
    - https://claude.com/api/mcp/auth_callback
    - https://chatgpt.com/connector_platform_oauth_redirect

  # Per-IP rate limiting of POST /oauth/register, /oauth/authorize and
  # /oauth/token, and of GET /oauth/authorize (429 + Retry-After). Zero or unset
  # values mean these defaults; they are generous because claude.ai and ChatGPT
  # use shared egress IPs.
  # rate_limit:
  #   disabled: false                                  # also turns off authorize_global
  #   register:  { per_minute: 60,  burst: 30 }
  #   token:     { per_minute: 300, burst: 100 }
  #   authorize: { per_minute: 30,  burst: 10 }
  #   authorize_form: { per_minute: 300, burst: 100 }  # GET /oauth/authorize
  #   # Unkeyed ceiling on submissions about to get a code. Default is derived
  #   # from code_ttl (2500 per minute at 5m), so the code cache cannot fill.
  #   # authorize_global: { per_minute: 2500, burst: 2500 }

# Limits on the proxied MCP paths (429 + Retry-After per IP / per grant, 503 when
# the global in-flight cap is reached). Zero or unset means these defaults,
# -1 disables a single limit, "disabled: true" turns all of them off.
# limits:
#   ip:    { per_minute: 1200, burst: 300 }   # per client IP, before token check
#   token: { per_minute: 300,  burst: 60 }    # per grant (upstream + required credentials, shared by all OAuth clients)
#   max_concurrent_per_token: 32              # in-flight requests; an SSE stream counts as one
#   max_in_flight: 1024                       # global, open SSE streams included; also Transport.MaxConnsPerHost
#   max_request_body: 10485760                # bytes (413 beyond), at least 1024; cannot be disabled

# Reverse proxies whose X-Forwarded-For / X-Real-IP are trusted for the client IP
# (access log and rate limiting). CIDRs or bare IPs; default: loopback only
# (127.0.0.0/8 and ::1/128); 0.0.0.0/0 and ::/0 are rejected.
# Setting it replaces the default, so keep loopback if nginx runs locally.
# trusted_proxies: ["127.0.0.0/8", "::1/128", "192.0.2.0/24"]

upstreams:
  - name: tn                       # [a-z0-9-]+, unique
    title: Tradernet               # shown on the authorize form (default: name)
    path: /tn/mcp                  # public path of literal segments [A-Za-z0-9._~-]; must not overlap /oauth, /.well-known, /healthz or other upstreams
    url: https://tradernet.com/mcp/tn  # https unless loopback or allow_insecure_http
    credentials:                   # headers the user types into the form
      - { header: X-TN-API-Key,    label: API key }
      # WARNING: on a public server, without an allow-list anyone with valid
      # Tradernet credentials can use this proxy as a relay: every upstream
      # request leaves from THIS server's IP and the upstream tools can place
      # and cancel orders and read the portfolio, so the activity points to you.
      # Set allowed_values below (strongly recommended) or keep the server
      # private. A startup warning is logged without it.
      # See docs/configuration.md#restricting-access
      # Optional allow-list (non-secret credentials only): only these values get
      # a token, existing tokens with other values stop working, and the upstream
      # is not contacted for anything else. Requires the validate block below
      # (startup fails without it). The allow-list gates token issuance only;
      # forbidden_arguments below covers request content.
      # (this line replaces the X-TN-API-Key entry above; do not enable both,
      # a duplicate header is a config error)
      # - { header: X-TN-API-Key, label: API key, allowed_values: ["REPLACE_WITH_YOUR_API_KEY"] }
      - { header: X-TN-API-Secret, label: API secret, secret: true }
      - { header: X-TN-SID,        label: SID, optional: true }
    # Verify the entered credentials with one authenticated MCP call before a
    # code is issued; if the upstream rejects them (or cannot be reached), no
    # token is handed out. Without this block any values are accepted.
    # The tool must be read-only. get_auth_info checks the API key and secret
    # but not the optional SID.
    validate:
      tool: get_auth_info
      # arguments: {}              # optional tool arguments (JSON object)
      # timeout: 10s               # whole check, default 10s, at most 60s
      # Tradernet answers a revoked or wrong key with HTTP 200 and a tool error,
      # not 401. With this on, a proxied tool error (isError: true) only
      # triggers the same check as above (verdict cached for 60s); if the check
      # says the credentials are rejected the client gets 401 invalid_token and
      # re-authorizes, otherwise the original response is forwarded unchanged.
      recheck_on_tool_error: true
    # Tool arguments that tools/call requests must not carry (top-level keys of
    # params.arguments, case-insensitive; presence is enough). Tradernet tools
    # accept api_key / api_secret as arguments, which would bypass the
    # credentials injected as headers. POST bodies are then read into memory and
    # inspected, failing closed (400 / 415) on anything unparsable; see
    # docs/configuration.md#forbidden-tool-arguments. Legitimate clients that
    # authenticate with headers are unaffected.
    forbidden_arguments: [api_key, api_secret]

# Optional built-in TLS (both files or neither); leave commented out when a
# reverse proxy terminates TLS. Relative paths are resolved against this file's
# directory. The files are re-checked every reload_interval (0 or unset =
# default 1m) and on SIGHUP; a bad new pair keeps the old certificate.
# tls:
#   cert_file: /etc/letsencrypt/live/mcp.example.com/fullchain.pem
#   key_file: /etc/letsencrypt/live/mcp.example.com/privkey.pem
#   reload_interval: 1m
