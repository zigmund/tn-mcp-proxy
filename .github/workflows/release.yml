# Manual release workflow: test -> tag -> GoReleaser -> GitHub Release.
# All actions are pinned to full commit SHAs (the comment gives the version);
# Dependabot (.github/dependabot.yml) proposes updates.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the latest stable version to bump (no tags yet: first release is v0.1.0)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional pre-release id, e.g. rc (gives vX.Y.Z-rc.N). Leave empty for a final release.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Never run two releases at once; queue instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Computed once here and reused by the release job so both agree.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: needed for the commit list since the previous tag.
          fetch-depth: 0
          # No credentials: ls-remote below relies on the repo being public
          # (a private fork would need credentials; it fails closed).
          persist-credentials: false

      - name: Check ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be cut from main (got $REF)"; exit 1
          fi

      - name: Test version script
        run: scripts/next-version_test.sh

      - name: Compute and validate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Remote tags are the source of truth; pipefail makes a failed
          # ls-remote abort instead of silently yielding "no tags".
          remote_tags="$(git ls-remote --tags --refs origin | sed 's#^.*[[:space:]]refs/tags/##')"
          VERSION="$(printf '%s\n' "$remote_tags" | scripts/next-version.sh --tags-stdin "$BUMP" "$PRERELEASE")"
          PREVIOUS="$(printf '%s\n' "$remote_tags" | scripts/next-version.sh --tags-stdin --base "$BUMP")"

          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(${pre}(\.${pre})*))?\$"
          if [[ ! "$VERSION" =~ $re ]]; then
            echo "::error::Computed version '$VERSION' is not valid semver with a v prefix"; exit 1
          fi
          git check-ref-format "refs/tags/$VERSION" || { echo "::error::Invalid tag name"; exit 1; }
          # Fail closed: rc 0 = tag exists, rc 2 = absent, anything else = error.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 || rc=$?
          case "$rc" in
            2) echo "Tag $VERSION is free" ;;
            0) echo "::error::Tag $VERSION already exists"; exit 1 ;;
            *) echo "::error::Could not query remote tags (git exit $rc)"; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "## Release $VERSION"
            echo
            echo "- Bump: \`$BUMP\`${PRERELEASE:+, pre-release id: \`$PRERELEASE\`}"
            if [[ -n "$PREVIOUS" ]]; then
              echo "- Previous stable tag: \`$PREVIOUS\`"
            else
              echo "- Previous stable tag: none (first release)"
            fi
            echo
            echo "### Commits since ${PREVIOUS:-the beginning} (first-parent)"
            echo
            echo '```'
            if [[ -n "$PREVIOUS" ]] && git rev-parse -q --verify "refs/tags/$PREVIOUS" >/dev/null; then
              range="$PREVIOUS..HEAD"
            else
              range="HEAD"
            fi
            git log -n 200 --first-parent --format='- %s (%h)' "$range"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  release:
    name: Tag and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.test.outputs.version }}
    permissions:
      contents: write # push tag, create release
    steps:
      # Credentials are persisted deliberately: the tag push below needs them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      # No build cache in the release job: avoids cache poisoning of artifacts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Create and push annotated tag
        id: tag
        run: |
          set -euo pipefail
          if [[ -z "${VERSION:-}" ]]; then
            echo "::error::VERSION is empty (test job output missing)"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          # Only reached when the push succeeded; gates the recovery hint below.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recovery instructions
        if: failure() && steps.tag.outputs.pushed == 'true'
        run: |
          echo "::error::Release failed after tag $VERSION was pushed. Clean up before re-running:"
          echo "  gh release delete \"$VERSION\" --repo \"$GITHUB_REPOSITORY\" --yes   # only if the release was created"
          echo "  git push origin \":refs/tags/$VERSION\"                                # delete the remote tag"

      - name: Pre-push failure hint
        if: failure() && steps.tag.outputs.pushed != 'true'
        run: |
          echo "::error::Release failed before the tag push completed. If unsure whether the tag reached the remote, check before re-running:"
          echo "  git ls-remote --tags origin \"refs/tags/$VERSION\""
